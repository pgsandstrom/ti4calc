services:
  web:
    build:
      context: .
      args:
        # Optional here so restart/logs/down work without it, the Dockerfile fails a build that lacks it
        GIT_HASH: ${GIT_HASH:-}
    ports:
      - "8200:3000"
    restart: always
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ti4calc
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/:/docker-entrypoint-initdb.d/
volumes:
  db:
