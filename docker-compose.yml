services:
  web:
    build:
      context: .
      args:
        GIT_HASH: '${GIT_HASH:?missing - run "pnpm release" instead, or set GIT_HASH=dev for a throwaway build}'
    ports:
      - '8200:3000'
    restart: always
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ti4calc
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/:/docker-entrypoint-initdb.d/
volumes:
  db:
